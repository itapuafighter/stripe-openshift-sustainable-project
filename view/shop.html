<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TIENDA DE FRUTOS SECOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Anton&family=Bebas+Neue&family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .tienda-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .producto-card {
      border: 2px solid black;
      border-radius: 5px;
      padding: 15px;
      background-color: #f0bd5e;
      text-align: center;
    }
    .producto-card img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border: 2px solid black;
      border-radius: 5px;
    }
    .producto-card h2 {
      font-family: "Anton", sans-serif;
      font-size: 1.2rem;
      margin: 10px 0 5px 0;
    }
    .producto-card p {
      font-family: "Courier Prime", monospace;
      font-size: 0.85rem;
      margin: 5px 0;
    }
    .producto-card .precio {
      font-family: "Bebas Neue", sans-serif;
      font-size: 1.5rem;
      margin: 10px 0;
    }
    .producto-card .sostenibilidad {
      font-family: "Courier Prime", monospace;
      font-size: 0.85rem;
      margin-bottom: 10px;
    }
    .cantidad-control {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 10px 0;
    }
    .cantidad-control input {
      width: 60px;
      text-align: center;
      padding: 5px;
      border: 1px solid black;
      border-radius: 5px;
      background-color: #f1e761;
      font-family: "Anton", sans-serif;
    }
    .boton-comprar {
      font-family: "Anton", sans-serif;
      background-color: #dbb11a;
      color: black;
      padding: 10px 20px;
      border: 1px solid black;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      width: 100%;
    }
    .boton-comprar:hover {
      background-color: #c49e18;
    }
    .nav-links {
      margin-bottom: 20px;
    }
    .nav-links a {
      font-family: "Anton", sans-serif;
      color: black;
      text-decoration: none;
      margin-right: 20px;
      border-bottom: 2px solid black;
    }
    .estrella {
      color: #dbb11a;
      text-shadow: 0 0 1px black;
    }
  </style>
</head>
<body>
  <div class="nav-links">
    <a href="/">← GUÍA NUTRICIONAL</a>
    <a href="/shop">TIENDA</a>
  </div>

  <h1>TIENDA DE FRUTOS SECOS SOSTENIBLES</h1>
  <p style="font-family: 'Courier Prime', monospace;">Todos nuestros productos tienen una puntuación de sostenibilidad de 3 o superior. Los productos con ⭐⭐⭐⭐⭐ tienen la máxima puntuación.</p>

  <div class="tienda-grid" id="productosGrid"></div>

  <script>
    function renderEstrellas(puntuacion) {
      return '★'.repeat(puntuacion) + '☆'.repeat(5 - puntuacion);
    }

    window.onload = async function() {
      const response = await fetch('/productos');
      const productos = await response.json();
      const grid = document.getElementById('productosGrid');

      productos.forEach(producto => {
        const card = document.createElement('div');
        card.className = 'producto-card';
        card.innerHTML = `
          <img src="/fotos/${producto.imagen}.jpeg" alt="${producto.nombre}">
          <h2>${producto.nombre}</h2>
          <p>${producto.descripcion}</p>
          <p class="sostenibilidad">Sostenibilidad: <span class="estrella">${renderEstrellas(producto.sostenibilidad)}</span></p>
          <p class="precio">€${parseFloat(producto.precio).toFixed(2)}</p>
          <div class="cantidad-control">
            <label for="cantidad-${producto.id}">Cantidad (100g):</label>
            <input type="number" id="cantidad-${producto.id}" value="1" min="1" max="10">
          </div>
          <button class="boton-comprar" onclick="comprar(${producto.id}, '${producto.nombre}', ${producto.precio})">
            COMPRAR
          </button>
        `;
        grid.appendChild(card);
      });
    };

    async function comprar(productoId, nombre, precio) {
      const cantidad = parseInt(document.getElementById(`cantidad-${productoId}`).value);

      if (cantidad < 1) {
        alert('Por favor selecciona una cantidad válida.');
        return;
      }

      try {
        const response = await fetch('/api/payment-session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ productoId, cantidad })
        });

        const data = await response.json();


      sessionStorage.setItem('stripeSession', JSON.stringify({
          clientSecret: data.clientSecret,
          ordenId: data.ordenId,
          producto: nombre,
          cantidad,
          total: (precio * cantidad).toFixed(2)
        }));

        window.location.href = '/checkout';

      } catch (err) {
        console.error('Error al iniciar el pago:', err);
        alert('Error al conectar con el servidor de pagos.');
      }
    }
  </script>
</body>
</html>
